version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: overlock-postgres
    environment:
      POSTGRES_DB: overlock_db
      POSTGRES_USER: overlock_ledger
      POSTGRES_PASSWORD: overlock_dev
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overlock_ledger -d overlock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: overlock-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
